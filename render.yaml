services:
  - type: web
    name: healthy-tiffin-inventory
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    disk:
      name: inventory-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATA_DIR
        value: /var/data
      - key: DEVICE_TOKEN
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: VISION_MODEL
        value: gpt-4.1-mini
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
