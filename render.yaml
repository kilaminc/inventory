# Optional AI and Sheets credentials are configured in the service environment after deployment.
services:
- type: web
  name: healthy-tiffin-inventory
  runtime: python
  plan: 0.5c-512mb
  rootDir: backend
  buildCommand: pip install -r requirements.txt
  startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1
  healthCheckPath: /health
  disk:
    name: inventory-data
    mountPath: /var/data
    sizeGB: 1
  envVars:
  - key: PYTHON_VERSION
    value: 3.12.10
  - key: DATA_DIR
    value: /var/data
  - key: DEVICE_TOKEN
    generateValue: true
  - key: VISION_MODEL
    value: gpt-4.1-mini
  region: oregon
